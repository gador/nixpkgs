name: "Upstream Sync"

on:
  schedule:
    - cron: "0 7 * * 1,4"
    # scheduled at 07:00 every Monday and Thursday

  workflow_dispatch: # click the button on Github repo!

permissions:
  contents: write

jobs:
  merge-from-upstream-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: current # set the branch to merge to
          fetch-depth: 0 # get all changes
      - name: Merge from upstream repo
        uses: discdiver/merge-from-upstream-repo@v0.0.9
        with:
          usermail: gitea-action@mail.flo-the.dev # set the user email for git commits
          username: gitea-action # set the user name for git commits
          upstream: NixOS/nixpkgs # set the upstream repo
          upstream-branch: master # set the upstream branch to merge from
          branch: current # set the branch to merge to
